name: Release

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Tag name for the release (e.g., v1.2.3)"
                required: true
                type: string
    workflow_call:
        inputs:
            tag_name:
                description: "Tag name for the release (e.g., v1.2.3)"
                required: true
                type: string

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.tag_name || github.event.inputs.tag_name }}

            - name: Generate changelog
              id: changelog
              uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
              with:
                  config: cliff.toml
                  args: --current --verbose
              env:
                  OUTPUT: CHANGELOG.md

            - name: Create Release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
              with:
                  tag_name: ${{ inputs.tag_name || github.event.inputs.tag_name }}
                  body: ${{ steps.changelog.outputs.content }}
                  draft: false
                  prerelease: ${{ contains(inputs.tag_name || github.event.inputs.tag_name, 'alpha') || contains(inputs.tag_name || github.event.inputs.tag_name, 'beta') }}
