name: Draft Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    pull-requests: read

concurrency:
    group: draft-release
    cancel-in-progress: true

jobs:
    draft-release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0

            - name: Generate changelog
              id: changelog
              uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
              with:
                  config: cliff.toml
                  args: --unreleased --verbose
              env:
                  OUTPUT: CHANGELOG.md

            - name: Delete existing draft release
              continue-on-error: true
              run: |
                  gh release delete next-release --yes
              env:
                  GH_TOKEN: ${{ github.token }}

            - name: Create or Update Draft Release
              uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
              with:
                  tag_name: next-release
                  name: "Next Release (Draft)"
                  body: |
                      ${{ steps.changelog.outputs.content }}

                      ---
                      *This is an automatically generated draft release.*
                  draft: true
                  prerelease: false
