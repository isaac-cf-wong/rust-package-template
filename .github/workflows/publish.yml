name: Publish

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Tag name for the publish (e.g., v1.2.3)"
                required: true
                type: string
    workflow_call:
        inputs:
            tag_name:
                description: "Tag name for the publish (e.g., v1.2.3)"
                required: true
                type: string

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.tag_name }}

            - name: Install Rust
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable

            - name: Cache Cargo
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            - name: Verify crate version matches tag
              run: |
                  EXPECTED_VERSION="${{ inputs.tag_name }}"
                  EXPECTED_VERSION="${EXPECTED_VERSION#v}"
                  ACTUAL_VERSION=$(
                    cargo metadata --no-deps --format-version 1 |
                      python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])'
                  )
                  if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
                    echo "Cargo.toml version $ACTUAL_VERSION does not match tag ${{ inputs.tag_name }}." >&2
                    exit 1
                  fi

            - name: Verify package
              run: cargo package

            - name: Note publish status
              if: vars.PUBLISH_TO_CRATES_IO != 'true'
              run: |
                  echo "Publishing is disabled for this template." >> "$GITHUB_STEP_SUMMARY"
                  echo "Set the repository variable PUBLISH_TO_CRATES_IO to true to enable crates.io publishing." >> "$GITHUB_STEP_SUMMARY"

    publish:
        needs: verify
        # Set the repository variable PUBLISH_TO_CRATES_IO to "true" once the
        # 'crates-io' environment and CARGO_REGISTRY_TOKEN secret are configured.
        if: vars.PUBLISH_TO_CRATES_IO == 'true'
        runs-on: ubuntu-latest
        environment: crates-io
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.tag_name }}

            - name: Install Rust
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
              with:
                  toolchain: stable

            - name: Cache Cargo
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

            - name: Verify crate version matches tag
              run: |
                  EXPECTED_VERSION="${{ inputs.tag_name }}"
                  EXPECTED_VERSION="${EXPECTED_VERSION#v}"
                  ACTUAL_VERSION=$(
                    cargo metadata --no-deps --format-version 1 |
                      python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])'
                  )
                  if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
                    echo "Cargo.toml version $ACTUAL_VERSION does not match tag ${{ inputs.tag_name }}." >&2
                    exit 1
                  fi

            - name: Publish crate
              run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
